services:
  - type: web
    name: forma-chatbot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: forma-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/chat.db
      - key: ATTACHMENTS_DIR
        value: /var/data/attachments
      - key: SESSION_SECRET
        generateValue: true
      # Optional HTTP Basic Auth: leave unset for public zero-login access with anonymous visitor session cookies.
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # Trusted proxy IP/CIDR for X-Forwarded-For resolution behind Render reverse proxy
      - key: TRUSTED_PROXIES
        value: 127.0.0.1,::1,10.0.0.0/8
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: duckduckgo
